name: Test Duplicate Finder
on:
  push:
    branches: [feature/windows-duplicate-finder]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile windows-duplicate-finder/duplicate_finder.py
      - run: python -m unittest discover -s windows-duplicate-finder -p "test_*.py" -v
